[package]
name = "mcpg-plugin-watch-mqtt"
version = "0.1.0-alpha.8"
license = "Apache-2.0"
edition = "2024"
description = "MQTT watch_strategy plugin for MCPG (dev.mcpg.watch.mqtt) — each message on subscribed topic filters as an MCP Event, acknowledged to the broker only once the gateway has stored it."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Gate declare_plugin! behind these — an ungated export risks a duplicate
# mcpg_plugin_register symbol if this crate ever links into the workspace
# alongside another exporter.
cdylib-export = []
static-firstparty = []
# Gates the docker-backed Mosquitto suite so plain `cargo test` stays cheap.
# Run: `cargo test -p mcpg-plugin-watch-mqtt --features integration-tests`.
integration-tests = []

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.46", version = "=0.1.0-beta.46" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.48", version = "=0.1.0-beta.48", features = ["static-firstparty"] }
# MQTT 3.1.1 client with manual acknowledgements; rustls for mqtts://.
rumqttc = "0.25"
# The crypto provider the plugin installs: a build that links both rustls
# providers has none by default, and rumqttc builds its TLS configuration
# from the default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Public roots for mqtts://, so a host without system certificates still
# verifies the broker.
webpki-roots = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
testcontainers = "0.27"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = "0.3"
